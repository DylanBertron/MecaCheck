name: Update MecaCheck DTC database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  update-dtc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MecaCheck
        uses: actions/checkout@v4

      - name: Checkout OBDex
        uses: actions/checkout@v4
        with:
          repository: foerbsnavi/obdex
          path: obdex

      - name: Build OBDex database
        working-directory: obdex
        run: |
          npm ci
          npm run build

      - name: Copy DTC database
        run: |
          cp obdex/dist/generic.json dtc.json

      - name: Validate DTC database
        run: |
          python - <<'PY'
          import json

          with open("dtc.json", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("DTC database is not a list")

          if len(data) < 9000:
              raise SystemExit(f"Only {len(data)} DTC records found")

          codes = [x.get("code") for x in data if isinstance(x, dict)]

          if len(codes) != len(set(codes)):
              raise SystemExit("Duplicate DTC codes detected")

          print(f"SUCCESS: {len(data)} DTC records validated")
          PY

      - name: Commit if changed
        run: |
          git config user.name "MecaCheck Bot"
          git config user.email "actions@users.noreply.github.com"

          git add dtc.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update DTC database"
            git push
          fi
