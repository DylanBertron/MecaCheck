services:
  - type: web
    name: mecacheck-ai
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ALLOWED_ORIGIN
        value: https://dylanbertron.github.io
