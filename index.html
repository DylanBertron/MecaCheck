<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>MecaCheck V6.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060d18;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:80px}.top{padding:20px 16px 12px;background:#060d18ee;position:sticky;top:0;z-index:3;border-bottom:1px solid #17263a}.brand{font-size:25px;font-weight:850}.sub,.muted{color:#8196b2}.main{padding:12px 14px}.card{background:#0b1625;border:1px solid #1a2a40;border-radius:18px;padding:15px;margin:10px 0}h2{font-size:18px;margin:2px 0 10px}input,select,textarea{width:100%;background:#07111d;color:#fff;border:1px solid #263b55;border-radius:12px;padding:12px;font-size:15px;margin:5px 0 9px}textarea{min-height:90px}button{border:0;border-radius:12px;padding:11px 14px;background:#287cff;color:#fff;font-weight:750}.result{background:#081321;border-left:3px solid #287cff;padding:12px;border-radius:12px;margin:8px 0}.warn{border-left-color:#e7b448}.ok{border-left-color:#2bc98a}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#07111eee;border-top:1px solid #1a2a40}.nav{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}nav button{background:none;color:#7890ad;border-radius:0;font-size:10px}nav button.active{color:#fff;background:#10233c}
</style></head><body><div class="app"><header class="top"><div class="brand">🔧 MecaCheck</div><div class="sub">V6.1 • base DTC locale</div></header><div class="main">
<section id="home"><div class="card"><h2>Diagnostic atelier</h2><p class="muted">La base DTC est servie depuis ton propre dépôt GitHub.</p><b id="count">—</b> <span class="muted">DTC chargés</span></div><div class="card"><h2>🔎 Recherche</h2><input id="qh" placeholder="P0420, turbo, capteur..."><button onclick="goSearch()">Rechercher</button></div></section>
<section id="dtc" class="hidden"><div class="card"><h2>📚 Base DTC</h2><input id="q" placeholder="Code ou mot-clé" oninput="search()"><div id="list">Chargement…</div></div></section>
<section id="vin" class="hidden"><div class="card"><h2>🚗 VIN</h2><input id="vinv" maxlength="17" placeholder="VIN 17 caractères"><button onclick="decodeVin()">Décoder avec vPIC</button><div id="vinres"></div></div></section>
<section id="diag" class="hidden"><div class="card"><h2>🧠 Diagnostic</h2><textarea id="dq" placeholder="Ex. P0299 + manque de puissance + pression turbo faible"></textarea><button onclick="diag()">Analyser</button><div id="dres"></div></div></section></div>
<nav><div class="nav"><button class="active" onclick="show('home',0)">🏠<br>Accueil</button><button onclick="show('dtc',1)">📚<br>DTC</button><button onclick="show('vin',2)">🚗<br>VIN</button><button onclick="show('diag',3)">🧠<br>Diagnostic</button></div></nav></div>
<script>
let db=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){try{let r=await fetch('./dtc.json',{cache:'no-store'});if(!r.ok)throw 0;db=await r.json();document.getElementById('count').textContent=db.length.toLocaleString('fr-FR');search()}catch(e){document.getElementById('list').innerHTML='<div class="result warn">dtc.json est absent du dépôt.</div>'}}
function show(id,n){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===n));if(id==='dtc')search()}
function search(){if(!db.length)return;let q=(document.getElementById('q')?.value||'').toLowerCase();let a=db.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,80);document.getElementById('list').innerHTML=a.map(x=>'<div class="result"><b>'+esc(x.code)+'</b> — '+esc(x.title?.en||'')+'<br><span class="muted">'+esc(x.description?.en||'')+'</span></div>').join('')||'<div class="muted">Aucun résultat.</div>'}
function goSearch(){show('dtc',1);document.getElementById('q').value=document.getElementById('qh').value;search()}
function diag(){let q=document.getElementById('dq').value.toUpperCase(),codes=[...q.matchAll(/\b[PBCU][0-9A-F]{4}\b/g)].map(x=>x[0]);document.getElementById('dres').innerHTML=codes.length?codes.map(c=>{let x=db.find(a=>a.code===c);return '<div class="result"><b>'+c+'</b> — '+esc(x?.title?.en||'Code non trouvé')+'</div>'}).join(''):'<div class="result warn">Ajoute un DTC.</div>'}
async function decodeVin(){let v=document.getElementById('vinv').value.trim().toUpperCase(),o=document.getElementById('vinres');if(v.length!==17){o.innerHTML='<div class="result warn">17 caractères attendus.</div>';return}o.innerHTML='Décodage…';try{let r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/'+encodeURIComponent(v)+'?format=json');let j=await r.json(),x=j.Results.reduce((a,z)=>(a[z.Variable]=z.Value,a),{});o.innerHTML='<div class="result ok"><b>'+esc(x.Make)+'</b> '+esc(x.Model)+'<br>Année : '+esc(x["Model Year"])+'<br>Moteur : '+esc(x["Engine Model"])+'</div>'}catch(e){o.innerHTML='<div class="result warn">vPIC inaccessible.</div>'}}
load();
</script></body></html>
